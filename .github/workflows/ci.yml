name: ci

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@1.96.0
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: bash scripts/ci.sh
